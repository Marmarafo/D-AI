[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "d-ai"
version = "1.0.0"
description = "D-AI: algorithmic multi-source research with cited, auditable answers (not an LLM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []          # standard library only

[project.scripts]
dai = "dai.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
